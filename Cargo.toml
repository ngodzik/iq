[workspace]
members = [
    "crates/core",
    "crates/llm",
    "crates/gate",
    "crates/agent",
    "crates/ui",
    "crates/gui",
    ".",
]
resolver = "3"

[workspace.package]
version     = "0.1.0"
edition     = "2024"
# The oldest toolchain the code is known to build on: the latest stable, since
# the binary is built from source and an older one buys nothing.
rust-version = "1.99.1"
authors     = ["Nicolas Godzik"]
license     = "MIT"

[workspace.dependencies]
iq-core  = { path = "crates/core", version = "0.1.0" }
iq-llm   = { path = "crates/llm", version = "0.1.0" }
iq-gate  = { path = "crates/gate", version = "0.1.0" }
iq-agent = { path = "crates/agent", version = "0.1.0" }
iq-ui    = { path = "crates/ui", version = "0.1.0" }
iq-gui   = { path = "crates/gui", version = "0.1.0" }

thiserror  = "2.0.21"
anyhow     = "1.0.104"
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio      = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
clap       = { version = "4.6.7", features = ["derive", "env"] }
# The default TLS backend verifies against the operating system trust store, so
# a corporate proxy whose root is installed on the machine just works, where a
# bundled root list would refuse it.
reqwest    = { version = "0.13.5", features = ["json"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
proptest   = "1.12.0"
tempfile   = "3.27.0"
toml       = "1.1.8"
# The sandbox on Linux: Landlock holds what a command may read, write and
# run, seccomp the sockets it may open. Both through safe interfaces. On
# macOS, Seatbelt holds it through the system's own sandbox-exec.
landlock    = "0.4.7"
seccompiler = "0.5.0"
# The system's constants: the calls seccomp refuses, and opening a file
# without following a link.
libc        = "0.2.180"
# A network of the commands' own on Linux, where only localhost answers:
# a user and a network namespace, and the loopback device brought up over
# netlink, through safe interfaces. Already in the tree, through Bevy.
nix         = { version = "0.31.3", default-features = false, features = ["sched", "user", "socket"] }
# Local time for when a subscription's window starts again, the system's
# time zone read as the platform keeps it.
jiff       = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# The window: Bevy draws it on the GPU, egui the panels, egui_plot the
# charts. bevy_egui 0.43 is the release for Bevy 0.20 and egui 0.36, which
# egui_plot 0.37 is built on. Only what a desktop window needs is enabled.
bevy       = { version = "0.20.0", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit", "bevy_window",
    "x11", "wayland", "bevy_render", "bevy_core_pipeline", "bevy_asset", "bevy_color",
    "bevy_camera", "bevy_mesh", "bevy_image", "bevy_shader",
] }
bevy_egui  = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
egui_plot  = "0.37.0"

[package]
name    = "iq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "iq"
path = "src/main.rs"

[dependencies]
iq-core.workspace            = true
iq-llm.workspace             = true
iq-gate.workspace            = true
iq-agent.workspace           = true
iq-ui.workspace              = true
iq-gui.workspace             = true
anyhow.workspace             = true
clap.workspace               = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace            = true
tracing-subscriber.workspace = true
serde.workspace              = true
serde_json.workspace         = true
toml.workspace               = true

[dev-dependencies]
tempfile.workspace = true

# Bevy's crates with their debug information take gigabytes, and are not
# what is debugged here.
[profile.dev.package."*"]
debug = false

[profile.release]
lto           = "fat"
codegen-units = 1
# Token counts and costs are summed over a whole session. An overflow that
# wraps silently would print a number that looks like a bill; a panic is the
# cheaper failure.
overflow-checks = true
