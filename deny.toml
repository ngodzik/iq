# Configuration for cargo-deny, run by scripts/check.sh.
#
# Three questions, none of which the compiler answers: is a dependency subject
# to a published advisory, is its licence compatible with shipping this under
# MIT, and did it come from somewhere other than crates.io.

[advisories]
version = 2
# An entry here is a decision to live with a known advisory, and it carries
# the advisory's identifier and the reason.
ignore = []

[licenses]
version = 2
# Derived from the dependency tree as it actually stands (cargo deny list -l license),
# not from a template. A new licence appearing here is a fact worth being told about.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    # foldhash, through the hash maps of the HTTP client's crates.
    # Permissive and OSI approved.
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A dependency pinned to "*" takes whatever version the registry happens to hold.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
