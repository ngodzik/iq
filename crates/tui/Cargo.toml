[package]
name    = "iq-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Draws iq's state in the terminal: the conversation in the terminal's own scrollback, the live part below it, the pages over it."

[dependencies]
iq-core.workspace  = true
iq-agent.workspace = true
iq-ui.workspace    = true
ratatui.workspace  = true
unicode-width.workspace = true
# Watching the terminal for keys, which tells when its window is closed.
nix = { workspace = true, features = ["poll"] }

[dev-dependencies]
vt100.workspace = true
