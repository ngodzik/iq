[package]
name    = "iq-assay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The assay: frozen exercises given to candidate models, each in a folder of its own, checked by hidden tests, then graded blind by one grader, so that a new model is tried on the person's own work."

[dependencies]
iq-core.workspace    = true
iq-gate.workspace    = true
iq-agent.workspace   = true
thiserror.workspace  = true
serde.workspace      = true
serde_json.workspace = true
toml.workspace       = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
tokio.workspace    = true
tempfile.workspace = true
