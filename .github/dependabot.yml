version: 2

# A release must be a week old before it is proposed: a compromised one is
# most often found and pulled within days.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
