name: CodeQL

# GitHub's analysis of the code for security flaws: the Rust, and the
# workflows themselves, where it finds what lets a pull request take over a
# run. Its findings show in the repository's Security tab and on pull
# requests.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 6"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To send its findings to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Something to analyze
        id: source
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" = rust ] && [ ! -f Cargo.toml ]; then
            echo "No Cargo.toml: no Rust to analyze."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Neither needs building: CodeQL reads Rust and workflows as they are.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.source.outputs.present == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.source.outputs.present == 'true'
        with:
          category: /language:${{ matrix.language }}
